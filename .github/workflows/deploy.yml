name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "🚀 Iniciando deploy..."

            cd /var/www/interviewier

            question_backup_dir=$(mktemp -d)
            trap 'rm -rf "$question_backup_dir"' EXIT
            question_files="app/code/questions.json app/cultural-fit/questions.json app/hr/questions.json app/technical/questions.json"

            echo "💾 Respaldando preguntas de producción..."
            for question_file in $question_files; do
              if [ -f "$question_file" ]; then
                mkdir -p "$question_backup_dir/$(dirname "$question_file")"
                cp "$question_file" "$question_backup_dir/$question_file"
              fi
            done

            echo "📥 Actualizando código..."
            git pull --ff-only origin main
            echo "Commit desplegado: $(git rev-parse --short HEAD)"

            echo "♻️ Restaurando preguntas de producción..."
            for question_file in $question_files; do
              if [ -f "$question_backup_dir/$question_file" ]; then
                mkdir -p "$(dirname "$question_file")"
                cp "$question_backup_dir/$question_file" "$question_file"
              fi
            done

            echo "📦 Instalando dependencias..."
            npm install

            echo "🔨 Generando build de Next.js..."
            npm run build

            echo "🔁 Reiniciando aplicación..."
            pm2 restart interviewier --update-env
            pm2 save

            echo "🔎 Verificando aplicación..."
            curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3000/technical > /dev/null

            echo "✅ Deploy terminado"
