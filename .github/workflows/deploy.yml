name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            echo "🚀 Iniciando deploy..."

            cd /var/www/interviewier

            echo "📥 Actualizando código..."
            git pull --ff-only origin main
            echo "Commit desplegado: $(git rev-parse --short HEAD)"

            echo "📦 Instalando dependencias..."
            npm install

            echo "🔨 Generando build de Next.js..."
            npm run build

            echo "🔁 Reiniciando aplicación..."
            pm2 restart interviewier --update-env
            pm2 save

            echo "🔎 Verificando aplicación..."
            curl --fail --silent --show-error http://127.0.0.1:3000/technical > /dev/null

            echo "✅ Deploy terminado"
